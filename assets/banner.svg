<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 44px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 20px; fill: #cbd5e1; }
    .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 14px; fill: #f3e8ff; }
    
    @keyframes float1 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(10px) rotate(-2deg); }
      100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.3; }
      50% { opacity: 0.7; }
      100% { opacity: 0.3; }
    }
    
    .floating-bg-1 { animation: float1 8s ease-in-out infinite; transform-origin: center; }
    .floating-bg-2 { animation: float2 10s ease-in-out infinite; transform-origin: center; }
    .glow-circle { animation: pulseGlow 6s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bg)" />

  <!-- Animated Glowing Background Elements -->
  <circle class="glow-circle" cx="200" cy="80" r="140" fill="#6366f1" filter="blur(60px)" opacity="0.4" />
  <circle class="glow-circle" cx="1000" cy="240" r="160" fill="#d946ef" filter="blur(70px)" opacity="0.4" />

  <!-- Dynamic / Animated Background Cards & Pills (Placed in background layer so title is in foreground) -->
  <g class="floating-bg-1">
    <rect x="80" y="220" width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="170" y="246" text-anchor="middle" class="badge-text">🏆 Peer Recognition</text>
  </g>

  <g class="floating-bg-2">
    <rect x="940" y="50" width="180" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="1030" y="76" text-anchor="middle" class="badge-text">🎁 Points &amp; Rewards</text>
  </g>

  <g class="floating-bg-1">
    <rect x="960" y="210" width="160" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="1040" y="236" text-anchor="middle" class="badge-text">🌟 Kudos &amp; Culture</text>
  </g>
  
  <g class="floating-bg-2">
    <rect x="60" y="50" width="160" height="42" rx="21" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <text x="140" y="76" text-anchor="middle" class="badge-text">⚡ Open Source &amp; SaaS</text>
  </g>

  <!-- Foreground Main Card Container -->
  <rect x="180" y="55" width="840" height="210" rx="20" fill="rgba(15, 23, 42, 0.65)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />

  <!-- Foreground Title and Subtitle -->
  <g text-anchor="middle">
    <text x="600" y="125" class="title">Awesome Employee Recognition Platform</text>
    <text x="600" y="168" class="subtitle">Curated SaaS &amp; Open-Source Recognition, Rewards, and Kudos Ecosystem</text>
    
    <!-- Decorative Line -->
    <rect x="420" y="192" width="360" height="4" rx="2" fill="url(#accentGrad)" />
    
    <!-- Category Pills in Foreground -->
    <text x="600" y="230" font-family="system-ui, sans-serif" font-size="14" fill="#a7f3d0" font-weight="600">
      ✨ Peer-to-Peer Appreciation • 🎖️ Milestone Awards • 💬 Slack &amp; Teams Bots • 📊 Culture Analytics
    </text>
  </g>
</svg>
